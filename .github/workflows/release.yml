name: release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

# contents: write so goreleaser can create the GitHub release; id-token: write
# to assume the AWS role that can sign with the KMS key
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          show-progress: false
          # goreleaser needs the tag history
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          # A tag run could restore a cache saved by a main run, so build clean
          cache: false

      # For scripts/kms-sign.py, which goreleaser runs to sign the checksums, with
      # the AWS credentials in scope. The runner's system Python refuses pip
      # installs (PEP 668).
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #6.2.0
        with:
          python-version: '3.12'

      # Every package is hash-pinned because it runs with the signing role
      - name: Install boto3
        run: python3 -m pip install --require-hashes -r scripts/requirements.txt

      # GitHub holds only the role ARN. The key lives in KMS and never leaves it;
      # the role may call kms:Sign on it for v* tags only. See ansible
      # docs/terraform-provider-signing.md
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        with:
          role-to-assume: ${{ secrets.GPG_SIGNING_ROLE_ARN }}
          aws-region: us-east-2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de #v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KMS_SIGNING_KEY: alias/terraform-provider-signing

      - name: Report failures to Slack
        if: ${{ always() }}
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 #v2.5.0
        with:
          notification_title: "It seems that my sole purpose in this dismal existence is to spread the gloomy news of broken code and shattered dreams."
          footer: "I think you ought to know I'm feeling very depressed."
          status: ${{ job.status }}
          notify_when: 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_REPORTING_WEBHOOK }}
