name: release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

# contents: write so goreleaser can create the GitHub release; id-token: write
# to assume the AWS role that holds the signing key
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          show-progress: false
          # goreleaser needs the tag history
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: false
        id: go

      - name: Restore Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            release-go-

      # GitHub holds only the role ARN. The key lives in Secrets Manager behind a
      # role trusted for v* tags; see ansible docs/terraform-provider-signing.md
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        with:
          role-to-assume: ${{ secrets.GPG_SIGNING_ROLE_ARN }}
          aws-region: us-east-2

      # parse-json-secrets unpacks into GPG_PRIVATE_KEY and GPG_PASSPHRASE, masked
      - name: Fetch signing key
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 #v3.0.1
        with:
          parse-json-secrets: true
          secret-ids: |
            GPG,terraform-provider-signing/gpg-key

      # The Terraform Registry verifies the SHA256SUMS signature against the
      # public key registered under the definednet namespace
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd #v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          passphrase: ${{ env.GPG_PASSPHRASE }}

      # The key is in the gpg-agent now; later steps have no use for the raw material
      - name: Drop the key from the environment
        run: |
          echo "GPG_PRIVATE_KEY=" >> "$GITHUB_ENV"
          echo "GPG_PASSPHRASE=" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de #v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Report failures to Slack
        if: ${{ always() }}
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 #v2.5.0
        with:
          notification_title: "It seems that my sole purpose in this dismal existence is to spread the gloomy news of broken code and shattered dreams."
          footer: "I think you ought to know I'm feeling very depressed."
          status: ${{ job.status }}
          notify_when: 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_REPORTING_WEBHOOK }}
