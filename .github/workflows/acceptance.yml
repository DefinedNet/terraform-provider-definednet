name: Acceptance
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

# Every run shares one test organization, and the sweeper deletes anything
# named tf-acc, so two runs at once would delete each other's objects.
concurrency:
  group: acceptance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance tests against api.defined.net
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          show-progress: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_wrapper: false

      - name: Sweep leftovers from earlier runs
        run: make sweep
        env:
          DEFINEDNET_API_KEY: ${{ secrets.DEFINEDNET_API_KEY }}

      - name: Run acceptance tests
        run: make testacc
        env:
          DEFINEDNET_API_KEY: ${{ secrets.DEFINEDNET_API_KEY }}

      - name: Sweep
        if: ${{ always() }}
        run: make sweep
        env:
          DEFINEDNET_API_KEY: ${{ secrets.DEFINEDNET_API_KEY }}

      - name: Report failures to Slack
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 #v2.5.0
        with:
          notification_title: "Acceptance tests against api.defined.net failed"
          status: ${{ job.status }}
          notify_when: 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_REPORTING_WEBHOOK }}
